<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="theme-color" content="#16a34a">
    <title>Order Details</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="js/config.js"></script>

    <style>
        body { overscroll-behavior-y: contain; -webkit-tap-highlight-color: transparent; }
        html { scroll-behavior: smooth; }
        :root { --primary-green: #16a34a; --primary-green-dark: #15803d; }
        @keyframes shimmer { 0% { background-position: -468px 0; } 100% { background-position: 468px 0; } }
        .skeleton { animation: shimmer 1.2s ease-in-out infinite; background: linear-gradient(to right, #f0f0f0 8%, #e0e0e0 18%, #f0f0f0 33%); background-size: 800px 104px; }
    </style>
</head>
<body class="bg-gray-50 font-sans antialiased">

<div class="min-h-screen bg-gray-50" x-data="orderDetail()" x-init="init()">

    <!-- Sticky Header -->
    <header class="sticky top-0 z-40 bg-white shadow-sm">
        <div class="flex items-center px-4 py-4">
            <a href="dashboard.html" class="mr-3">
                <svg class="w-6 h-6 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
            </a>
            <div class="flex-1">
                <h1 class="text-lg font-bold text-gray-800">Order Details</h1>
                <p class="text-sm text-gray-500" x-text="order.id"></p>
            </div>
            <span
                class="px-3 py-1 text-xs font-semibold rounded-full"
                :class="{
                    'bg-yellow-100 text-yellow-800': order.status === 'pending',
                    'bg-blue-100 text-blue-800': order.status === 'accepted',
                    'bg-green-100 text-green-800': order.status === 'picked_up' || order.status === 'out_for_delivery',
                    'bg-gray-100 text-gray-800': order.status === 'delivered'
                }"
                x-text="order.status_label"
            ></span>
        </div>
    </header>

    <!-- Loading Skeleton -->
    <div x-show="loading" class="px-4 py-4">
        <div class="bg-white rounded-xl p-4 shadow-sm mb-4">
            <div class="skeleton h-6 w-1/2 mb-3 rounded"></div>
            <div class="skeleton h-4 w-full mb-2 rounded"></div>
            <div class="skeleton h-4 w-2/3 rounded"></div>
        </div>
    </div>

    <!-- Order Content -->
    <div x-show="!loading" class="px-4 py-4 space-y-4 pb-32">
        <div x-show="errorMessage" x-transition class="p-3 bg-red-50 border border-red-200 rounded-lg">
            <p class="text-sm text-red-600" x-text="errorMessage"></p>
        </div>

        <div x-show="shouldShowMap()" class="bg-white rounded-xl shadow-sm overflow-hidden">
            <div class="p-4 border-b border-gray-100 flex items-center justify-between">
                <div>
                    <h2 class="text-sm font-semibold text-gray-500">LIVE ROUTE</h2>
                    <p class="text-xs text-gray-500 mt-1" x-text="mapData.eta.available ? `${mapData.eta.minutes} min ETA` : 'No ETA available'"></p>
                </div>
                <button
                    @click="openMaps"
                    class="inline-flex items-center px-3 py-2 bg-blue-600 text-white text-sm font-medium rounded-lg"
                >
                    Open Full Map
                </button>
            </div>
            <div x-ref="mapPreview" class="h-64 w-full bg-gray-100"></div>
        </div>

        <!-- Order Summary Card -->
        <div x-show="order.id" class="bg-white rounded-xl shadow-sm p-4">
            <h2 class="text-sm font-semibold text-gray-500 mb-3">ORDER SUMMARY</h2>
            <div class="space-y-3">
                <div class="flex justify-between">
                    <span class="text-gray-600">Order ID:</span>
                    <span class="font-semibold text-gray-800" x-text="order.id"></span>
                </div>
                <div class="flex justify-between">
                    <span class="text-gray-600">Order Date:</span>
                    <span class="text-gray-800" x-text="order.created_at"></span>
                </div>
                <div class="flex justify-between">
                    <span class="text-gray-600">Payment:</span>
                    <span class="text-gray-800" x-text="order.payment_method"></span>
                </div>
                <div class="flex justify-between">
                    <span class="text-gray-600">Amount:</span>
                    <span class="font-bold text-green-600" x-text="'₹' + order.total_amount"></span>
                </div>
            </div>
        </div>

        <!-- Store Details Card -->
        <div x-show="order.id" class="bg-white rounded-xl shadow-sm p-4">
            <h2 class="text-sm font-semibold text-gray-500 mb-3">PICKUP FROM</h2>
            <div class="flex items-start">
                <div class="w-10 h-10 bg-green-100 rounded-lg flex items-center justify-center mr-3">
                    <svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
                    </svg>
                </div>
                <div class="flex-1">
                    <p class="font-semibold text-gray-800" x-text="order.store_name"></p>
                    <p class="text-sm text-gray-600 mt-1" x-text="order.store_address"></p>
                    <p class="text-sm text-gray-500 mt-1" x-text="order.store_phone"></p>
                </div>
            </div>
        </div>

        <!-- Customer Details Card -->
        <div x-show="order.id" class="bg-white rounded-xl shadow-sm p-4">
            <h2 class="text-sm font-semibold text-gray-500 mb-3">DELIVER TO</h2>
            <div class="flex items-start">
                <div class="w-10 h-10 bg-blue-100 rounded-lg flex items-center justify-center mr-3">
                    <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                    </svg>
                </div>
                <div class="flex-1">
                    <p class="font-semibold text-gray-800" x-text="order.customer_name"></p>
                    <p class="text-sm text-gray-600 mt-1" x-text="order.delivery_address"></p>
                    <a :href="'tel:' + order.customer_phone" class="inline-flex items-center text-sm text-green-600 mt-2">
                        <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path>
                        </svg>
                        <span x-text="order.customer_phone"></span>
                    </a>
                </div>
            </div>
        </div>

        <!-- Products List Card -->
        <div x-show="order.id" class="bg-white rounded-xl shadow-sm p-4">
            <h2 class="text-sm font-semibold text-gray-500 mb-3">PRODUCTS</h2>
            <div class="space-y-3">
                <template x-for="product in order.products" :key="product.id">
                    <div class="flex items-center justify-between py-2 border-b border-gray-100 last:border-0">
                        <div class="flex-1">
                            <p class="font-medium text-gray-800" x-text="product.name"></p>
                            <p class="text-xs text-gray-500" x-text="'Qty: ' + product.quantity"></p>
                        </div>
                        <p class="font-semibold text-gray-800" x-text="'₹' + product.price"></p>
                    </div>
                </template>
            </div>
        </div>

        <!-- Delivery Instructions (if any) -->
        <div x-show="order.delivery_notes" class="bg-yellow-50 border border-yellow-200 rounded-xl p-4">
            <div class="flex">
                <svg class="w-5 h-5 text-yellow-600 mr-2 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <div>
                    <p class="text-sm font-semibold text-yellow-800">Delivery Instructions</p>
                    <p class="text-sm text-yellow-700 mt-1" x-text="order.delivery_notes"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Fixed Bottom Action Bar -->
    <div x-show="order.id" class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 p-4 z-30">
        <template x-if="order.status === 'pending'">
            <div class="grid grid-cols-2 gap-3 mb-2">
                <button
                    @click="showCancelModal = true"
                    class="py-3 px-4 bg-red-600 hover:bg-red-700 text-white font-semibold rounded-xl transition-all flex items-center justify-center"
                >
                    <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                    Cancel
                </button>
                <button
                    @click="acceptOrder"
                    class="py-3 px-4 bg-green-600 hover:bg-green-700 text-white font-semibold rounded-xl transition-all flex items-center justify-center"
                >
                    <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                    </svg>
                    Accept Order
                </button>
            </div>
        </template>

        <template x-if="order.status !== 'pending' && order.status !== 'delivered'">
            <button
                @click="openStatusModal"
                class="w-full py-3 px-4 bg-green-600 hover:bg-green-700 text-white font-semibold rounded-xl transition-all flex items-center justify-center mb-2"
            >
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                </svg>
                Update Status
            </button>
        </template>

        <button
            x-show="shouldShowMap()"
            @click="openMaps"
            class="w-full py-3 px-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl transition-all flex items-center justify-center"
        >
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
            </svg>
            Open Live Map
        </button>
    </div>

    <!-- Status Update Modal -->
    <div x-show="showStatusModal" @click.self="showStatusModal = false" class="fixed inset-0 bg-black bg-opacity-50 flex items-end justify-center z-50" style="display: none;">
        <div @click.away="showStatusModal = false" class="bg-white rounded-t-3xl w-full max-w-lg p-6 transform transition-transform" :class="showStatusModal ? 'translate-y-0' : 'translate-y-full'">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-bold text-gray-800">Update Status</h3>
                <button @click="showStatusModal = false" class="text-gray-400 hover:text-gray-600">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>

            <div class="space-y-2">
                <template x-for="status in availableStatuses" :key="status.id">
                    <button
                        @click="status.is_clickable && updateStatus(status.api_status)"
                        :disabled="!status.is_clickable"
                        :class="status.is_clickable ? 'bg-green-50 border-green-600 cursor-pointer' : 'bg-gray-100 border-gray-200 text-gray-400 cursor-not-allowed opacity-70'"
                        class="w-full p-4 border-2 rounded-xl text-left transition-all"
                    >
                        <p class="font-semibold" :class="status.is_clickable ? 'text-gray-800' : 'text-gray-500'" x-text="status.name"></p>
                        <p class="text-xs" :class="status.is_clickable ? 'text-gray-500' : 'text-gray-400'" x-text="status.description || status.name"></p>
                    </button>
                </template>
            </div>
        </div>
    </div>

    <!-- Cancel Order Modal -->
    <div x-show="showCancelModal" @click.self="showCancelModal = false" class="fixed inset-0 bg-black bg-opacity-50 flex items-end justify-center z-50" style="display: none;">
        <div @click.away="showCancelModal = false" class="bg-white rounded-t-3xl w-full max-w-lg p-6">
            <h3 class="text-lg font-bold text-gray-800 mb-4">Cancel Order</h3>

            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">Cancellation Reason</label>
                <select x-model="cancelReason" class="w-full p-3 border-2 border-gray-200 rounded-xl focus:border-green-600 focus:ring-2 focus:ring-green-200">
                    <option value="">Select reason</option>
                    <option value="store_closed">Store is closed</option>
                    <option value="product_unavailable">Product not available</option>
                    <option value="customer_request">Customer requested cancellation</option>
                    <option value="vehicle_issue">Vehicle breakdown</option>
                    <option value="other">Other reason</option>
                </select>
            </div>

            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-2">Additional Notes (Optional)</label>
                <textarea
                    x-model="cancelNotes"
                    rows="3"
                    class="w-full p-3 border-2 border-gray-200 rounded-xl focus:border-green-600 focus:ring-2 focus:ring-green-200"
                    placeholder="Enter any additional details..."
                ></textarea>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <button
                    @click="showCancelModal = false"
                    class="py-3 px-4 bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold rounded-xl transition-all"
                >
                    Back
                </button>
                <button
                    @click="cancelOrder"
                    :disabled="!cancelReason"
                    class="py-3 px-4 bg-red-600 hover:bg-red-700 text-white font-semibold rounded-xl transition-all disabled:opacity-50"
                >
                    Confirm Cancel
                </button>
            </div>
        </div>
    </div>

</div>

<div id="toast-container" class="fixed top-4 right-4 z-50 space-y-2"></div>

<script src="js/common.js"></script>
<script>
    function orderDetail() {
        const params = new URLSearchParams(window.location.search);

        return {
            orderId: params.get('id'),
            order: {},
            mapData: {
                eta: { available: false, minutes: null },
                driver: {},
                destination: {},
                vendor: {},
                trail: [],
            },
            loading: true,
            errorMessage: '',
            showStatusModal: false,
            availableStatuses: [],
            showCancelModal: false,
            cancelReason: '',
            cancelNotes: '',
            map: null,
            mapMarkers: {},
            directionsRenderer: null,
            mapRefreshTimer: null,

            init() {
                this.checkAuth();
                this.loadOrderDetails();
            },

            checkAuth() {
                const token = localStorage.getItem('driver_token');
                if (!token) {
                    driverLogout();
                }
            },

            async loadOrderDetails() {
                this.loading = true;
                this.errorMessage = '';
                const token = localStorage.getItem('driver_token');

                try {
                    const response = await fetch(`${API_BASE_URL}/api/driver/orders/${this.orderId}`, {
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Accept': 'application/json',
                        }
                    });

                    const data = await handleDriverApiResponse(response, 'Failed to load order details.');

                    if (!data) {
                        return;
                    }

                    if (data.error) {
                        this.order = {};
                        this.errorMessage = data.message;
                    } else {
                        this.order = data;
                        if (this.shouldShowMap()) {
                            await this.loadMapData();
                        }
                    }
                } catch (error) {
                    console.error('Error loading order:', error);
                    this.order = {};
                    this.errorMessage = 'Network error. Please try again.';
                } finally {
                    this.loading = false;
                }
            },

            shouldShowMap() {
                return ['accepted', 'picked_up', 'out_for_delivery'].includes(this.order.status);
            },

            async loadMapData() {
                const token = localStorage.getItem('driver_token');

                try {
                    const response = await fetch(`${API_BASE_URL}/api/driver/orders/${this.orderId}/map`, {
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Accept': 'application/json',
                        }
                    });

                    const data = await handleDriverApiResponse(response, 'Failed to load map data.');

                    if (!data || data.error) {
                        return;
                    }

                    this.mapData = data;
                    loadGoogleMapsScript(() => this.$nextTick(() => this.renderPreviewMap()));

                    if (!this.mapRefreshTimer) {
                        this.mapRefreshTimer = window.setInterval(() => {
                            void this.loadMapData();
                        }, 30000);
                    }
                } catch (error) {
                    console.error('Error loading map data:', error);
                }
            },

            renderPreviewMap() {
                if (typeof google === 'undefined' || !this.$refs.mapPreview) {
                    return;
                }

                const fallbackCenter = {
                    lat: this.mapData.driver.lat ?? this.mapData.destination.lat ?? 17.385,
                    lng: this.mapData.driver.lng ?? this.mapData.destination.lng ?? 78.4867,
                };

                if (!this.map) {
                    this.map = new google.maps.Map(this.$refs.mapPreview, {
                        center: fallbackCenter,
                        zoom: 13,
                        disableDefaultUI: true,
                    });
                    this.directionsRenderer = new google.maps.DirectionsRenderer({
                        map: this.map,
                        suppressMarkers: true,
                        polylineOptions: {
                            strokeColor: '#2563eb',
                            strokeWeight: 5,
                        },
                    });
                }

                this.syncMapMarkers();
                this.drawRoute();
            },

            syncMapMarkers() {
                const points = [
                    ['driver', this.mapData.driver, 'D'],
                    ['destination', this.mapData.destination, 'C'],
                    ['vendor', this.mapData.vendor, 'V'],
                ];

                points.forEach(([key, point, label]) => {
                    if (point?.lat == null || point?.lng == null) {
                        return;
                    }

                    const position = { lat: Number(point.lat), lng: Number(point.lng) };

                    if (!this.mapMarkers[key]) {
                        this.mapMarkers[key] = new google.maps.Marker({
                            position,
                            map: this.map,
                            label,
                        });
                    } else {
                        this.mapMarkers[key].setPosition(position);
                    }
                });
            },

            drawRoute() {
                if (!this.mapData.driver?.lat || !this.mapData.driver?.lng || !this.mapData.destination?.lat || !this.mapData.destination?.lng) {
                    return;
                }

                const directionsService = new google.maps.DirectionsService();
                directionsService.route({
                    origin: { lat: Number(this.mapData.driver.lat), lng: Number(this.mapData.driver.lng) },
                    destination: { lat: Number(this.mapData.destination.lat), lng: Number(this.mapData.destination.lng) },
                    travelMode: google.maps.TravelMode.DRIVING,
                }, (result, status) => {
                    if (status === 'OK') {
                        this.directionsRenderer.setDirections(result);
                    }
                });
            },

            openMaps() {
                window.location.href = `order-map.html?id=${encodeURIComponent(this.orderId)}`;
            },

            async openStatusModal() {
                this.showStatusModal = true;
                this.availableStatuses = [];
                await this.loadAvailableStatuses();
            },

            async loadAvailableStatuses() {
                const token = localStorage.getItem('driver_token');

                try {
                    const response = await fetch(`${API_BASE_URL}/api/driver/orders/${this.orderId}/statuses`, {
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Accept': 'application/json',
                        }
                    });

                    const data = await handleDriverApiResponse(response, 'Failed to load order statuses.');

                    if (!data || data.error) {
                        this.availableStatuses = [];
                        return;
                    }

                    this.availableStatuses = data.data?.statuses || [];
                } catch (error) {
                    this.availableStatuses = [];
                }
            },

            async acceptOrder() {
                await this.updateStatus('accepted');
            },

            async updateStatus(status) {
                if (status === 'delivered') {
                    const captured = await capturePod(this.orderId);
                    if (!captured) {
                        return;
                    }
                }

                const token = localStorage.getItem('driver_token');
                showLoading();

                try {
                    const response = await fetch(`${API_BASE_URL}/api/driver/orders/${this.orderId}/status`, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Content-Type': 'application/json',
                            'Accept': 'application/json',
                        },
                        body: JSON.stringify({ status })
                    });

                    const data = await handleDriverApiResponse(response, 'Failed to update status');

                    if (!data) {
                        return;
                    }

                    if (!data.error) {
                        showToast('Status updated successfully', 'success');
                        this.showStatusModal = false;
                        this.availableStatuses = [];
                        await this.loadOrderDetails();
                    } else {
                        showToast(data.message || 'Failed to update status', 'error');
                    }
                } catch (error) {
                    showToast('Network error. Please try again.', 'error');
                } finally {
                    hideLoading();
                }
            },

            async cancelOrder() {
                if (!this.cancelReason) {
                    showToast('Please select a cancellation reason', 'error');
                    return;
                }

                const token = localStorage.getItem('driver_token');
                showLoading();

                try {
                    const response = await fetch(`${API_BASE_URL}/api/driver/orders/${this.orderId}/cancel`, {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Content-Type': 'application/json',
                            'Accept': 'application/json',
                        },
                        body: JSON.stringify({
                            reason: this.cancelReason,
                            notes: this.cancelNotes
                        })
                    });

                    const data = await handleDriverApiResponse(response, 'Failed to cancel order');

                    if (!data) {
                        return;
                    }

                    if (!data.error) {
                        showToast('Order cancelled successfully', 'success');
                        setTimeout(() => {
                            window.location.href = 'dashboard.html';
                        }, 1500);
                    } else {
                        showToast(data.message || 'Failed to cancel order', 'error');
                    }
                } catch (error) {
                    showToast('Network error. Please try again.', 'error');
                } finally {
                    hideLoading();
                    this.showCancelModal = false;
                }
            },

            destroy() {
                if (this.mapRefreshTimer) {
                    window.clearInterval(this.mapRefreshTimer);
                }
            }
        }
    }
</script>
</body>
</html>
